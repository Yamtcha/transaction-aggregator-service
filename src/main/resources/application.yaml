spring:
  application:
    name: spending-aggregator-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AGGREGATOR_DB_URL}
    username: ${AGGREGATOR_DB_USERNAME}
    password: ${AGGREGATOR_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5671
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

rabbitmq:
  queues:
    transactions: fintrack.transactions

server:
  port: 8083

api:
  key: ${API_KEY}

spending:
  categorization:
    noise-prefix: '(?i)^(card\s*purchase|pos\s*purchase|pos|acb\s*(debit|credit)|debit\s*order|internet\s*(transfer|pmt)|naedo|early\s*decom|recurring\s*payment|so\s+|dd\s+|eft\s*(payment|debit)|faster\s*payment|bank\s*charge|service\s*fee|atm)[\s*:/-]*'
    reference-noise: '[*#|]|\\d{6,}'
    rules:
      INCOME:
        - 'salary'
        - 'payroll'
        - 'wages?'
        - 'remuneration'
        - 'bonus'
        - 'dividend'
