spring:
  application:
    name: spending-aggregator-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5671
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

server:
  port: 8083

spending:
  categorization:
    noise-prefix: '(?i)^(card\s*purchase|pos\s*purchase|pos|acb\s*(debit|credit)|debit\s*order|internet\s*(transfer|pmt)|naedo|early\s*decom|recurring\s*payment|so\s+|dd\s+|eft\s*(payment|debit)|faster\s*payment|bank\s*charge|service\s*fee|atm)[\s*:/-]*'
    reference-noise: '[*#|]|\\d{6,}'
    rules:
      - category: INCOME
        priority: 1
        patterns:
          - 'salary'
          - 'payroll'
          - 'wages?'
          - 'remuneration'
          - 'bonus'
          - 'dividend'
          - 'commission\\s*pay'
          - 'pension'
          - 'sassa'
          - 'grant'
          - 'refund'
          - 'cashback'
          - 'reimburs'
          - 'credit\\s*reversal'
          - 'interest\\s*earned'

      - category: TRANSFER
        priority: 2
        patterns:
          - 'eft'
          - 'electronic\\s*transfer'
          - 'instant\\s*payment'
          - 'rtc'
          - 'bank\\s*transfer'
          - 'funds\\s*transfer'
          - 'zapper'
          - 'snapscan'
          - 'instant\\s*money'
          - 'moya'
          - 'wallet'

      - category: UTILITIES
        priority: 3
        patterns:
          - 'eskom'
          - 'city\\s*power'
          - 'electricity'
          - 'prepaid\\s*(meter|electric|power)'
          - 'yaka'
          - 'water\\s*(account|meter|levy)?'
          - 'sewerage'
          - 'rates\\s*(&|and)\\s*taxes'
          - 'municipality'
          - 'tshwane'
          - 'ekurhuleni'
          - 'city\\s*of\\s*(jhb|cape\\s*town|tshwane)'
          - 'voda(com)?'
          - 'mtn'
          - 'telkom'
          - 'cell\\s*c'
          - 'rain'
          - 'fibre'
          - 'adsl'
          - 'openserve'
          - 'vumatel'
          - 'frogfoot'
          - 'metrofibre'
          - 'evotel'
          - 'airtime'
          - 'data\\s*bundle'

      - category: HEALTHCARE
        priority: 4
        patterns:
          - 'dischem'
          - 'clicks'
          - 'netcare'
          - 'mediclini?c'
          - 'life\\s*hospital'
          - 'intercare'
          - 'dentist'
          - 'dental'
          - 'optometr'
          - 'doctor'
          - 'pharmac'
          - 'hospital'
          - 'clinic'
          - 'medical\\s*(aid|centre)'
          - 'prescription'
          - 'vitamin'

      - category: GROCERIES
        priority: 5
        patterns:
          - 'checkers'
          - 'shoprite'
          - 'usave'
          - 'pick\\s*n\\s*pay'
          - 'pnp'
          - 'woolworths(?!\\s*(home|beauty))'
          - 'spar'
          - 'makro'
          - 'game\\s*store'
          - 'box?er'
          - 'freshstop'
          - 'ok\\s*foods'
          - 'ok\\s*grocer'
          - '7-?eleven'
          - 'fruit\\s*(&|and)\\s*veg'

      - category: DINING
        priority: 6
        patterns:
          - 'spur'
          - 'mcdon(ald)?s?'
          - 'kfc'
          - 'steers'
          - 'nandos?'
          - 'wimpy'
          - 'debonairs'
